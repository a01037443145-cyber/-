<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO - Personal Space</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #121216; color: #e4e4e7; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-14 bg-[#18181b] border-b border-[#27272a] flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold tracking-wider text-indigo-400">CHRONO</span>
            <span class="text-xs text-zinc-400 bg-[#27272a] px-2 py-0.5 rounded">Personal Space</span>
        </div>
        <div class="flex items-center gap-4 text-sm text-zinc-400">
            <span id="current-time-display">2026. 10. 31. (토)</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-[#18181b] border-r border-[#27272a] flex flex-col shrink-0">
            <div class="p-4 border-b border-[#27272a]">
                <button onclick="openModal('routine')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                    <span>⚡ 루틴 관리</span>
                </button>
            </div>
            
            <div class="flex-1 p-4 space-y-6 overflow-y-auto">
                <div>
                    <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Navigation</h3>
                    <nav class="space-y-1">
                        <button onclick="switchDrawerTab('schedule')" id="nav-schedule" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium bg-[#27272a] text-white transition">📅 일정 관리</button>
                        <button onclick="switchDrawerTab('reflection')" id="nav-reflection" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:bg-[#202024] hover:text-white transition">📝 하루 정리</button>
                        <button onclick="switchDrawerTab('diary')" id="nav-diary" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:bg-[#202024] hover:text-white transition">📖 자유 일기장</button>
                    </nav>
                </div>

                <div>
                    <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Categories</h3>
                    <div class="space-y-1 text-sm">
                        <label class="flex items-center gap-2 px-3 py-1.5 rounded hover:bg-[#202024] cursor-pointer">
                            <input type="checkbox" checked class="accent-indigo-500" onchange="toggleCategory('work', this)">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> 업무/공부
                        </label>
                        <label class="flex items-center gap-2 px-3 py-1.5 rounded hover:bg-[#202024] cursor-pointer">
                            <input type="checkbox" checked class="accent-indigo-500" onchange="toggleCategory('personal', this)">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 개인 일정
                        </label>
                        <label class="flex items-center gap-2 px-3 py-1.5 rounded hover:bg-[#202024] cursor-pointer">
                            <input type="checkbox" checked class="accent-indigo-500" onchange="toggleCategory('health', this)">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span> 운동/루틴
                        </label>
                    </div>
                </div>
            </div>

            <!-- 알림 권한 설정 버튼 영역 -->
            <div class="p-4 border-t border-[#27272a] space-y-2">
                <button onclick="requestNotificationPermission()" class="w-full bg-[#27272a] hover:bg-[#3f3f46] text-zinc-200 text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5">
                    <span>🔔 알림 받기 설정</span>
                </button>
                <div id="notif-status" class="text-[11px] text-center text-zinc-400">알림 대기중</div>
            </div>
        </aside>

        <!-- Center Calendar / Content View -->
        <main class="flex-1 flex flex-col bg-[#121216] overflow-hidden">
            <!-- Calendar Navigation Header -->
            <div class="h-16 border-b border-[#27272a] flex items-center justify-between px-8 shrink-0 bg-[#151518]">
                <div class="flex items-center gap-4">
                    <h2 id="cal-title" class="text-xl font-bold text-zinc-100">2026년 10월</h2>
                    <div class="flex items-center bg-[#1d1d21] rounded-lg border border-[#27272a] p-0.5">
                        <button onclick="moveNav(-1)" class="p-1.5 hover:bg-[#27272a] rounded-md text-zinc-400 hover:text-white transition">◀</button>
                        <button onclick="goToday()" class="px-3 py-1 text-xs font-medium text-zinc-300 hover:text-white transition">오늘</button>
                        <button onclick="moveNav(1)" class="p-1.5 hover:bg-[#27272a] rounded-md text-zinc-400 hover:text-white transition">▶</button>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="setViewMode('month')" id="btn-view-month" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition">월간</button>
                    <button onclick="setViewMode('week')" id="btn-view-week" class="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:bg-[#27272a] hover:text-white transition">주간</button>
                </div>
            </div>

            <!-- Calendar Grid Container -->
            <div id="calendar-container" class="flex-1 flex flex-col overflow-y-auto p-6">
                <!-- Days Header -->
                <div id="days-header" class="grid grid-cols-7 gap-px mb-2 text-center text-xs font-semibold text-zinc-400">
                    <div class="text-red-400">일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div class="text-blue-400">토</div>
                </div>
                <!-- Days Matrix -->
                <div id="calendar-grid" class="grid grid-cols-7 grid-rows-6 gap-px flex-1 bg-[#27272a] rounded-xl overflow-hidden border border-[#27272a]">
                    <!-- JS dynamically generates days -->
                </div>
            </div>
        </main>

        <!-- Right Drawer Panel -->
        <aside class="w-96 bg-[#18181b] border-l border-[#27272a] flex flex-col shrink-0">
            <div class="h-16 border-b border-[#27272a] flex items-center justify-between px-6 shrink-0">
                <div class="flex items-center gap-2">
                    <span id="drawer-date-title" class="font-bold text-zinc-100">2026년 10월 31일</span>
                    <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full font-medium">선택됨</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <!-- 탭 1: 일정 목록 -->
                <div id="tab-schedule" class="space-y-6">
                    <div>
                        <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3">새 일정 추가</h4>
                        <div class="space-y-3 bg-[#1d1d21] p-4 rounded-xl border border-[#27272a]">
                            <input type="text" id="event-title-input" placeholder="일정 내용을 입력하세요" class="w-full bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-indigo-500">
                            <div class="flex gap-2">
                                <select id="event-cat-input" class="flex-1 bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-300 focus:outline-none focus:border-indigo-500">
                                    <option value="work">업무/공부</option>
                                    <option value="personal">개인 일정</option>
                                    <option value="health">운동/루틴</option>
                                </select>
                                <input type="time" id="event-time-input" class="w-32 bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500">
                            </div>
                            <button onclick="addEvent()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition text-sm">일정 추가하기</button>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3">오늘의 일정</h4>
                        <div id="event-list" class="space-y-2">
                            <!-- Dynamic Event Items -->
                        </div>
                    </div>

                    <!-- 오늘의 루틴 체크리스트 -->
                    <div class="pt-4 border-t border-[#27272a]">
                        <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3">오늘의 루틴 체크리스트 🔄</h4>
                        <div id="routine-checklist" class="space-y-2">
                            <!-- Dynamic Routine Checklist Items -->
                        </div>
                    </div>
                </div>

                <!-- 탭 2: 하루 정리 -->
                <div id="tab-reflection" class="space-y-4 hidden">
                    <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">하루 피드백 및 다짐</h4>
                    <textarea id="reflection-textarea" oninput="saveReflection()" placeholder="오늘 하루를 돌아보며 피드백이나 내일의 다짐을 적어보세요..." class="w-full h-80 bg-[#1d1d21] border border-[#27272a] rounded-xl p-4 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>

                <!-- 탭 3: 자유 일기장 -->
                <div id="tab-diary" class="space-y-4 hidden">
                    <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">자유 일기장</h4>
                    <textarea id="diary-textarea" oninput="saveDiary()" placeholder="자유롭게 생각을 기록하세요..." class="w-full h-80 bg-[#1d1d21] border border-[#27272a] rounded-xl p-4 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>
            </div>

            <!-- Drawer Bottom Tab Switcher -->
            <div class="h-14 border-t border-[#27272a] grid grid-cols-3 bg-[#151518] p-2 gap-1 shrink-0 text-xs font-medium">
                <button onclick="switchDrawerTab('schedule')" id="drawer-tab-schedule" class="bg-[#27272a] text-white rounded-lg transition flex items-center justify-center">일정 목록</button>
                <button onclick="switchDrawerTab('reflection')" id="drawer-tab-reflection" class="text-zinc-400 hover:text-white rounded-lg transition flex items-center justify-center">하루 정리</button>
                <button onclick="switchDrawerTab('diary')" id="drawer-tab-diary" class="text-zinc-400 hover:text-white rounded-lg transition flex items-center justify-center">자유 일기장</button>
            </div>
        </aside>
    </div>

    <!-- Routine Management Modal -->
    <div id="routine-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-[#18181b] border border-[#27272a] rounded-2xl w-full max-w-md p-6 space-y-6 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-zinc-100">⚡ 반복 루틴 관리</h3>
                <button onclick="closeModal('routine')" class="text-zinc-400 hover:text-white text-lg">✕</button>
            </div>
            <div class="space-y-3 bg-[#1d1d21] p-4 rounded-xl border border-[#27272a]">
                <div class="flex gap-2">
                    <input type="text" id="routine-title-input" placeholder="새로운 루틴 이름 입력" class="flex-1 bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-indigo-500">
                    <input type="time" id="routine-time-input" class="w-32 bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex items-center justify-between pt-1">
                    <div class="flex gap-1 text-xs" id="routine-days-selector">
                        <button type="button" onclick="toggleRoutineDay(this, 0)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition" data-day="0">일</button>
                        <button type="button" onclick="toggleRoutineDay(this, 1)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition" data-day="1">월</button>
                        <button type="button" onclick="toggleRoutineDay(this, 2)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition" data-day="2">화</button>
                        <button type="button" onclick="toggleRoutineDay(this, 3)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition" data-day="3">수</button>
                        <button type="button" onclick="toggleRoutineDay(this, 4)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition" data-day="4">목</button>
                        <button type="button" onclick="toggleRoutineDay(this, 5)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition" data-day="5">금</button>
                        <button type="button" onclick="toggleRoutineDay(this, 6)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition" data-day="6">토</button>
                    </div>
                    <button onclick="addRoutine()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-lg font-medium transition">루틴 추가</button>
                </div>
            </div>
            <div class="space-y-2 max-h-60 overflow-y-auto" id="routine-list-modal">
                <!-- Dynamic Routine List -->
            </div>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        let currentDate = new Date();
        let selectedDateStr = formatDateKey(new Date());
        let viewMode = 'month';
        let activeCategories = { work: true, personal: true, health: true };

        let dbEvents = JSON.parse(localStorage.getItem('chrono_events') || '{}');
        let dbRoutines = JSON.parse(localStorage.getItem('chrono_routines') || '[]');
        let dbRoutineLogs = JSON.parse(localStorage.getItem('chrono_routine_logs') || '{}');
        let dbReflections = JSON.parse(localStorage.getItem('chrono_reflections') || '{}');
        let dbDiaries = JSON.parse(localStorage.getItem('chrono_diaries') || '{}');

        function formatDateKey(date) {
            let y = date.getFullYear();
            let m = String(date.getMonth() + 1).padStart(2, '0');
            let d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function initApp() {
            renderCalendar();
            selectDate(selectedDateStr);
            startNotificationMonitor();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => self.clients.claim());
                `)).catch(() => {});
            }
        }

        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                alert('이 브라우저는 알림을 지원하지 않습니다.');
                return;
            }
            Notification.requestPermission().then(permission => {
                const statusEl = document.getElementById('notif-status');
                if (permission === 'granted') {
                    statusEl.textContent = '알림 활성화됨 ✓';
                    statusEl.className = 'text-[11px] text-center text-emerald-400 font-medium';
                    new Notification('CHRONO 알림', { body: 'CHRONO 알림 설정이 성공적으로 완료되었습니다!' });
                } else {
                    statusEl.textContent = '알림 차단됨';
                    statusEl.className = 'text-[11px] text-center text-red-400 font-medium';
                }
            });
        }

        function startNotificationMonitor() {
            setInterval(() => {
                const now = new Date();
                const todayStr = formatDateKey(now);
                const currentHour = String(now.getHours()).padStart(2, '0');
                const currentMin = String(now.getMinutes()).padStart(2, '0');
                const currentTimeStr = `${currentHour}:${currentMin}`;

                if (dbEvents[todayStr]) {
                    dbEvents[todayStr].forEach(ev => {
                        if (ev.time === currentTimeStr && !ev.notified) {
                            ev.notified = true;
                            if (Notification.permission === 'granted') {
                                new Notification(`[CHRONO 일정]`, { body: ev.title });
                            }
                        }
                    });
                }

                let dayOfWeek = now.getDay();
                dbRoutines.forEach(r => {
                    if (r.days.includes(dayOfWeek) && r.time === currentTimeStr && !r.notified) {
                        r.notified = true;
                        if (Notification.permission === 'granted') {
                            new Notification(`[CHRONO 루틴]`, { body: r.title });
                        }
                    }
                });
            }, 10000);
        }

        function renderCalendar() {
            if (viewMode === 'month') {
                renderMonthView();
            } else {
                renderWeekView();
            }
        }

        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('cal-title').textContent = `${year}년 ${month + 1}월`;

            document.getElementById('days-header').style.display = 'grid';

            const grid = document.getElementById('calendar-grid');
            grid.className = "grid grid-cols-7 grid-rows-6 gap-px flex-1 bg-[#27272a] rounded-xl overflow-hidden border border-[#27272a]";
            grid.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            let totalCells = 42;
            let daysHtml = '';

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                let d = prevLastDay - i;
                let prevMonth = month === 0 ? 11 : month - 1;
                let prevYear = month === 0 ? year - 1 : year;
                let dateStr = `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                daysHtml += createCellHtml(d, dateStr, true, false);
            }

            for (let d = 1; d <= lastDay; d++) {
                let dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                let isToday = formatDateKey(new Date()) === dateStr;
                daysHtml += createCellHtml(d, dateStr, false, isToday);
            }

            let remainingCells = totalCells - (firstDayIndex + lastDay);
            for (let d = 1; d <= remainingCells; d++) {
                let nextMonth = month === 11 ? 0 : month + 1;
                let nextYear = month === 11 ? year + 1 : year;
                let dateStr = `${nextYear}-${String(nextMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                daysHtml += createCellHtml(d, dateStr, true, false);
            }

            grid.innerHTML = daysHtml;
        }

        function renderWeekView() {
            const grid = document.getElementById('calendar-grid');
            document.getElementById('days-header').style.display = 'none';
            // grid-rows-1로 고정하여 세로로 늘어나지 않고 월간처럼 네모 박스 형태 유지
            grid.className = "grid grid-cols-7 grid-rows-1 gap-px bg-[#27272a] rounded-xl overflow-hidden border border-[#27272a] h-full";
            grid.innerHTML = '';

            let curr = new Date(currentDate);
            let first = curr.getDate() - curr.getDay();
            let sunday = new Date(curr.setDate(first));

            let startYear = sunday.getFullYear();
            let startMonth = sunday.getMonth() + 1;
            let startDay = sunday.getDate();

            let saturday = new Date(sunday);
            saturday.setDate(saturday.getDate() + 6);
            let endYear = saturday.getFullYear();
            let endMonth = saturday.getMonth() + 1;
            let endDay = saturday.getDate();

            document.getElementById('cal-title').textContent = `${startYear}.${startMonth}.${startDay} ~ ${endYear}.${endMonth}.${endDay}`;

            let daysHtml = '';
            for (let i = 0; i < 7; i++) {
                let d = new Date(sunday);
                d.setDate(sunday.getDate() + i);
                let dateStr = formatDateKey(d);
                let isToday = formatDateKey(new Date()) === dateStr;
                
                let dayNames = ['일', '월', '화', '수', '목', '금', '토'];
                let weekdayName = dayNames[i];
                let colorStyle = i === 0 ? 'text-red-400' : (i === 6 ? 'text-blue-400' : 'text-zinc-400');

                let events = dbEvents[dateStr] || [];
                let filteredEvents = events.filter(ev => activeCategories[ev.category]);

                let badgesHtml = '';
                filteredEvents.forEach(ev => {
                    let colorClass = ev.category === 'work' ? 'bg-blue-500/20 text-blue-400' : ev.category === 'personal' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400';
                    badgesHtml += `<div class="text-[11px] px-2 py-1 rounded mb-1 truncate ${colorClass}">${ev.time ? ev.time + ' ' : ''}${ev.title}</div>`;
                });

                let selectionClass = selectedDateStr === dateStr ? 'bg-[#202025] ring-1 ring-indigo-500' : 'bg-[#151518] hover:bg-[#1a1a1e]';
                let todayIndicator = isToday ? 'bg-indigo-600 text-white font-bold' : '';

                daysHtml += `
                    <div onclick="selectDate('${dateStr}')" class="${selectionClass} p-3 flex flex-col cursor-pointer transition relative overflow-hidden group h-full">
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-[#27272a]">
                            <span class="text-xs font-semibold ${colorStyle}">${weekdayName}</span>
                            <span class="text-xs font-medium w-6 h-6 flex items-center justify-center rounded-full ${todayIndicator} text-zinc-200">${d.getDate()}</span>
                        </div>
                        <div class="space-y-1 overflow-y-auto flex-1">
                            ${badgesHtml}
                        </div>
                    </div>
                `;
            }
            grid.innerHTML = daysHtml;
        }

        function createCellHtml(dayNum, dateStr, isOtherMonth, isToday) {
            let events = dbEvents[dateStr] || [];
            let filteredEvents = events.filter(ev => activeCategories[ev.category]);

            let badgesHtml = '';
            filteredEvents.slice(0, 2).forEach(ev => {
                let colorClass = ev.category === 'work' ? 'bg-blue-500/20 text-blue-400' : ev.category === 'personal' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400';
                badgesHtml += `<div class="text-[10px] px-1.5 py-0.5 rounded truncate ${colorClass}">${ev.time ? ev.time + ' ' : ''}${ev.title}</div>`;
            });
            if (filteredEvents.length > 2) {
                badgesHtml += `<div class="text-[9px] text-zinc-500 px-1">+${filteredEvents.length - 2} more</div>`;
            }

            let selectionClass = selectedDateStr === dateStr ? 'bg-[#202025] ring-1 ring-indigo-500' : 'bg-[#151518] hover:bg-[#1a1a1e]';
            let textClass = isOtherMonth ? 'text-zinc-600' : 'text-zinc-200';
            let todayIndicator = isToday ? 'bg-indigo-600 text-white font-bold' : '';

            return `
                <div onclick="selectDate('${dateStr}')" class="${selectionClass} p-2 flex flex-col justify-between cursor-pointer transition relative overflow-hidden group">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium w-6 h-6 flex items-center justify-center rounded-full ${todayIndicator} ${textClass}">${dayNum}</span>
                    </div>
                    <div class="space-y-1 mt-1 overflow-hidden">
                        ${badgesHtml}
                    </div>
                </div>
            `;
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            let parts = dateStr.split('-');
            document.getElementById('drawer-date-title').textContent = `${parts[0]}년 ${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
            renderCalendar();
            renderEventsForSelectedDate();
            renderRoutineChecklist();
            loadReflectionAndDiary();
        }

        function renderEventsForSelectedDate() {
            let container = document.getElementById('event-list');
            let events = dbEvents[selectedDateStr] || [];
            if (events.length === 0) {
                container.innerHTML = `<div class="text-xs text-zinc-500 text-center py-4 bg-[#1d1d21] rounded-xl border border-[#27272a]">등록된 일정이 없습니다.</div>`;
                return;
            }
            container.innerHTML = events.map((ev, idx) => {
                let dotColor = ev.category === 'work' ? 'bg-blue-500' : ev.category === 'personal' ? 'bg-emerald-500' : 'bg-amber-500';
                return `
                    <div class="flex items-center justify-between bg-[#1d1d21] p-3 rounded-xl border border-[#27272a] text-sm">
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            <span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span>
                            <span class="text-zinc-200 truncate">${ev.time ? '<span class="text-xs text-indigo-400 font-mono mr-1">[' + ev.time + ']</span>' : ''}${ev.title}</span>
                        </div>
                        <button onclick="deleteEvent(${idx})" class="text-zinc-500 hover:text-red-400 text-xs px-1.5 py-0.5 transition">✕</button>
                    </div>
                `;
            }).join('');
        }

        function addEvent() {
            let titleInput = document.getElementById('event-title-input');
            let catInput = document.getElementById('event-cat-input');
            let timeInput = document.getElementById('event-time-input');
            if (!titleInput.value.trim()) return;

            if (!dbEvents[selectedDateStr]) dbEvents[selectedDateStr] = [];
            dbEvents[selectedDateStr].push({
                title: titleInput.value.trim(),
                category: catInput.value,
                time: timeInput.value || '',
                notified: false
            });

            localStorage.setItem('chrono_events', JSON.stringify(dbEvents));
            titleInput.value = '';
            timeInput.value = '';
            renderCalendar();
            renderEventsForSelectedDate();
        }

        function deleteEvent(idx) {
            dbEvents[selectedDateStr].splice(idx, 1);
            if (dbEvents[selectedDateStr].length === 0) delete dbEvents[selectedDateStr];
            localStorage.setItem('chrono_events', JSON.stringify(dbEvents));
            renderCalendar();
            renderEventsForSelectedDate();
        }

        function renderRoutineChecklist() {
            let container = document.getElementById('routine-checklist');
            let dayOfWeek = new Date(selectedDateStr).getDay();
            let todaysRoutines = dbRoutines.filter(r => r.days.includes(dayOfWeek));

            if (todaysRoutines.length === 0) {
                container.innerHTML = `<div class="text-xs text-zinc-500 text-center py-3 bg-[#1d1d21] rounded-xl border border-[#27272a]">오늘 예정된 루틴이 없습니다.</div>`;
                return;
            }

            let logs = dbRoutineLogs[selectedDateStr] || [];
            container.innerHTML = todaysRoutines.map(r => {
                let isChecked = logs.includes(r.id);
                return `
                    <label class="flex items-center justify-between bg-[#1d1d21] p-3 rounded-xl border border-[#27272a] cursor-pointer hover:border-zinc-700 transition">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleRoutineLog('${r.id}')" class="w-4 h-4 accent-indigo-500 rounded">
                            <span class="text-sm ${isChecked ? 'line-through text-zinc-500' : 'text-zinc-200'}">${r.title} ${r.time ? '<span class="text-xs text-indigo-400 font-mono ml-1">(' + r.time + ')</span>' : ''}</span>
                        </div>
                        <span class="text-[10px] text-zinc-500 bg-[#27272a] px-2 py-0.5 rounded">루틴</span>
                    </label>
                `;
            }).join('');
        }

        function toggleRoutineLog(routineId) {
            if (!dbRoutineLogs[selectedDateStr]) dbRoutineLogs[selectedDateStr] = [];
            let logs = dbRoutineLogs[selectedDateStr];
            let idx = logs.indexOf(routineId);
            if (idx > -1) {
                logs.splice(idx, 1);
            } else {
                logs.push(routineId);
            }
            localStorage.setItem('chrono_routine_logs', JSON.stringify(dbRoutineLogs));
            renderRoutineChecklist();
            renderCalendar();
        }

        function renderRoutineModalList() {
            let container = document.getElementById('routine-list-modal');
            if (dbRoutines.length === 0) {
                container.innerHTML = `<div class="text-xs text-zinc-500 text-center py-3">등록된 루틴이 없습니다.</div>`;
                return;
            }
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            container.innerHTML = dbRoutines.map(r => {
                let daysStr = r.days.map(d => dayNames[d]).join(', ');
                return `
                    <div class="flex items-center justify-between bg-[#121216] p-3 rounded-xl border border-[#27272a] text-sm">
                        <div>
                            <div class="font-medium text-zinc-200">${r.title} ${r.time ? '<span class="text-xs text-indigo-400 font-mono ml-1">[' + r.time + ']</span>' : ''}</div>
                            <div class="text-[11px] text-zinc-500">반복: ${daysStr}</div>
                        </div>
                        <button onclick="deleteRoutine('${r.id}')" class="text-zinc-500 hover:text-red-400 text-xs px-2 py-1">삭제</button>
                    </div>
                `;
            }).join('');
        }

        let newRoutineSelectedDays = [1, 2, 3, 4, 5];
        function toggleRoutineDay(btn, dayNum) {
            let idx = newRoutineSelectedDays.indexOf(dayNum);
            if (idx > -1) {
                newRoutineSelectedDays.splice(idx, 1);
                btn.className = "routine-day-btn w-7 h-7 rounded-full bg-[#27272a] text-zinc-400 font-medium flex items-center justify-center transition";
            } else {
                newRoutineSelectedDays.push(dayNum);
                btn.className = "routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition";
            }
        }

        function addRoutine() {
            let input = document.getElementById('routine-title-input');
            let timeInput = document.getElementById('routine-time-input');
            if (!input.value.trim() || newRoutineSelectedDays.length === 0) return;
            dbRoutines.push({
                id: 'r_' + Date.now(),
                title: input.value.trim(),
                time: timeInput.value || '',
                days: [...newRoutineSelectedDays],
                notified: false
            });
            localStorage.setItem('chrono_routines', JSON.stringify(dbRoutines));
            input.value = '';
            timeInput.value = '';
            renderRoutineModalList();
            renderCalendar();
            renderRoutineChecklist();
        }

        function deleteRoutine(id) {
            dbRoutines = dbRoutines.filter(r => r.id !== id);
            localStorage.setItem('chrono_routines', JSON.stringify(dbRoutines));
            renderRoutineModalList();
            renderCalendar();
            renderRoutineChecklist();
        }

        function loadReflectionAndDiary() {
            document.getElementById('reflection-textarea').value = dbReflections[selectedDateStr] || '';
            document.getElementById('diary-textarea').value = dbDiaries[selectedDateStr] || '';
        }

        function saveReflection() {
            let val = document.getElementById('reflection-textarea').value;
            if (val) dbReflections[selectedDateStr] = val;
            else delete dbReflections[selectedDateStr];
            localStorage.setItem('chrono_reflections', JSON.stringify(dbReflections));
        }

        function saveDiary() {
            let val = document.getElementById('diary-textarea').value;
            if (val) dbDiaries[selectedDateStr] = val;
            else delete dbDiaries[selectedDateStr];
            localStorage.setItem('chrono_diaries', JSON.stringify(dbDiaries));
        }

        function openModal(name) {
            if (name === 'routine') {
                renderRoutineModalList();
                document.getElementById('routine-modal').classList.remove('hidden');
                document.getElementById('routine-modal').classList.add('flex');
            }
        }

        function closeModal(name) {
            if (name === 'routine') {
                document.getElementById('routine-modal').classList.remove('flex');
                document.getElementById('routine-modal').classList.add('hidden');
            }
        }

        function moveNav(dir) {
            if (viewMode === 'month') {
                currentDate.setMonth(currentDate.getMonth() + dir);
            } else {
                currentDate.setDate(currentDate.getDate() + (dir * 7));
            }
            renderCalendar();
        }

        function goToday() {
            currentDate = new Date();
            selectDate(formatDateKey(currentDate));
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btn-view-month').className = mode === 'month' ? 'px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition' : 'px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:bg-[#27272a] hover:text-white transition';
            document.getElementById('btn-view-week').className = mode === 'week' ? 'px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition' : 'px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:bg-[#27272a] hover:text-white transition';
            renderCalendar();
        }

        function toggleCategory(cat, checkbox) {
            activeCategories[cat] = checkbox.checked;
            renderCalendar();
        }

        function switchDrawerTab(tab) {
            ['schedule', 'reflection', 'diary'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`drawer-tab-${t}`).className = "text-zinc-400 hover:text-white rounded-lg transition flex items-center justify-center";
                let navBtn = document.getElementById(`nav-${t}`);
                if (navBtn) navBtn.className = "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:bg-[#202024] hover:text-white transition";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`drawer-tab-${tab}`).className = "bg-[#27272a] text-white rounded-lg transition flex items-center justify-center";
            let activeNavBtn = document.getElementById(`nav-${tab}`);
            if (activeNavBtn) activeNavBtn.className = "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium bg-[#27272a] text-white transition";
        }

        window.onload = initApp;
    </script>
</body>
</html>
