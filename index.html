=<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO - Personal Space</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { border-radius: 3px; }
        [data-theme="light"] input[type="time"] { color: #18181b; }
    </style>
</head>
<body id="app-body" class="min-h-screen flex flex-col bg-[#121216] text-[#e4e4e7]" data-theme="dark">

    <!-- Header -->
    <header id="app-header" class="h-14 bg-[#18181b] border-b border-[#27272a] flex items-center justify-between px-4 md:px-6 shrink-0 transition-colors sticky top-0 z-30">
        <div class="flex items-center gap-3">
            <span class="text-lg md:text-xl font-bold tracking-wider text-indigo-400">CHRONO</span>
            <span id="header-badge" class="text-xs text-zinc-400 bg-[#27272a] px-2 py-0.5 rounded hidden sm:inline-block">Personal Space</span>
        </div>
        <div class="flex items-center gap-2 text-xs md:text-sm text-zinc-400">
            <!-- 테마 전환 버튼 -->
            <button onclick="toggleTheme()" id="theme-toggle-btn" class="bg-[#27272a] hover:bg-[#3f3f46] text-zinc-200 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                <span id="theme-icon">☀️</span> <span id="theme-text">라이트 모드</span>
            </button>
            <span id="current-time-display">2026. 11. 1. (일)</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <div id="main-workspace" class="flex-1 flex flex-col md:flex-row w-full transition-all duration-200">
        
        <!-- Sidebar Navigation -->
        <aside id="app-sidebar" class="w-full md:w-64 bg-[#18181b] md:border-r border-b md:border-b-0 border-[#27272a] flex flex-col shrink-0 transition-colors">
            <div id="sidebar-top" class="p-4 border-b border-[#27272a] shrink-0">
                <button onclick="openModal('routine')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                    <span>⚡ 루틴 관리</span>
                </button>
            </div>
            
            <div class="p-4 space-y-6">
                <div>
                    <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Navigation</h3>
                    <nav class="space-y-1">
                        <button onclick="switchDrawerTab('schedule')" id="nav-schedule" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium bg-[#27272a] text-white transition">📅 일정</button>
                        <button onclick="switchDrawerTab('reflection')" id="nav-reflection" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:bg-[#202024] hover:text-white transition">📝 정리</button>
                        <button onclick="switchDrawerTab('diary')" id="nav-diary" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:bg-[#202024] hover:text-white transition">📖 일기</button>
                    </nav>
                </div>

                <div id="category-box">
                    <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Categories</h3>
                    <div class="space-y-1 text-sm">
                        <label class="flex items-center gap-2 px-3 py-1.5 rounded hover:bg-zinc-100 dark:hover:bg-[#202024] cursor-pointer">
                            <input type="checkbox" checked class="accent-indigo-500" onchange="toggleCategory('work', this)">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> 업무/공부
                        </label>
                        <label class="flex items-center gap-2 px-3 py-1.5 rounded hover:bg-zinc-100 dark:hover:bg-[#202024] cursor-pointer">
                            <input type="checkbox" checked class="accent-indigo-500" onchange="toggleCategory('personal', this)">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 개인 일정
                        </label>
                        <label class="flex items-center gap-2 px-3 py-1.5 rounded hover:bg-zinc-100 dark:hover:bg-[#202024] cursor-pointer">
                            <input type="checkbox" checked class="accent-indigo-500" onchange="toggleCategory('health', this)">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span> 운동/루틴
                        </label>
                    </div>
                </div>
            </div>

            <!-- 알림 권한 및 백업/복원 영역 -->
            <div id="sidebar-bottom" class="p-4 border-t border-[#27272a] space-y-2 shrink-0">
                <button onclick="requestNotificationPermission()" id="btn-notif" class="w-full bg-[#27272a] hover:bg-[#3f3f46] text-zinc-200 text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5">
                    <span>🔔 알림 설정</span>
                </button>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="exportData()" id="btn-backup" class="bg-[#27272a] hover:bg-[#3f3f46] text-zinc-300 text-xs py-2 px-3 rounded-lg transition text-center font-medium">💾 백업</button>
                    <button onclick="document.getElementById('import-file').click()" id="btn-restore" class="bg-[#27272a] hover:bg-[#3f3f46] text-zinc-300 text-xs py-2 px-3 rounded-lg transition text-center font-medium">📂 복원</button>
                    <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                </div>
                <div id="notif-status" class="text-[11px] text-center text-zinc-400 pt-1">대기중</div>
            </div>
        </aside>

        <!-- Center Calendar / Content View -->
        <main id="main-content" class="flex-1 flex flex-col bg-[#121216] transition-colors min-h-[500px]">
            <!-- Calendar Navigation Header -->
            <div id="cal-nav-header" class="h-16 border-b border-[#27272a] flex items-center justify-between px-4 md:px-8 shrink-0 bg-[#151518] transition-colors">
                <div class="flex items-center gap-2 md:gap-4">
                    <h2 id="cal-title" class="text-lg md:text-xl font-bold text-zinc-100">2026년 11월</h2>
                    <div id="cal-nav-btns" class="flex items-center bg-[#1d1d21] rounded-lg border border-[#27272a] p-0.5 transition-colors">
                        <button onclick="moveNav(-1)" class="p-1.5 hover:bg-[#27272a] rounded-md text-zinc-400 hover:text-white transition">◀</button>
                        <button onclick="goToday()" id="btn-today-nav" class="px-2.5 md:px-3 py-1 text-xs font-medium text-zinc-300 hover:text-white transition">오늘</button>
                        <button onclick="moveNav(1)" class="p-1.5 hover:bg-[#27272a] rounded-md text-zinc-400 hover:text-white transition">▶</button>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="setViewMode('month')" id="btn-view-month" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition">월간</button>
                    <button onclick="setViewMode('week')" id="btn-view-week" class="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:bg-[#27272a] hover:text-white transition">주간</button>
                </div>
            </div>

            <!-- Calendar Grid Container -->
            <div id="calendar-container" class="flex-1 flex flex-col p-4 md:p-6 min-h-[400px]">
                <!-- Days Header -->
                <div id="days-header" class="grid grid-cols-7 gap-px mb-2 text-center text-xs font-semibold text-zinc-400">
                    <div class="text-red-400">일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div class="text-blue-400">토</div>
                </div>
                <!-- Days Matrix -->
                <div id="calendar-grid" class="grid grid-cols-7 grid-rows-6 gap-px flex-1 bg-[#27272a] rounded-xl overflow-hidden border border-[#27272a] min-h-[350px]">
                    <!-- JS dynamically generates days -->
                </div>
            </div>
        </main>

        <!-- Right Drawer Panel -->
        <aside id="app-drawer" class="w-full md:w-96 bg-[#18181b] md:border-l border-t md:border-t-0 border-[#27272a] flex flex-col shrink-0 transition-colors">
            <div id="drawer-header" class="h-16 border-b border-[#27272a] flex items-center justify-between px-6 shrink-0 transition-colors">
                <div class="flex items-center gap-2">
                    <span id="drawer-date-title" class="text-base font-bold text-zinc-100">2026년 11월 1일</span>
                    <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2.5 py-0.5 rounded-full font-medium">선택됨</span>
                </div>
            </div>

            <div class="p-6 space-y-6">
                <!-- 탭 1: 일정 목록 -->
                <div id="tab-schedule" class="space-y-6">
                    <div>
                        <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3">새 일정 추가</h4>
                        <div id="event-input-box" class="space-y-3 bg-[#1d1d21] p-4 rounded-xl border border-[#27272a] transition-colors">
                            <input type="text" id="event-title-input" placeholder="일정 내용을 입력하세요" class="w-full bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors">
                            <div class="flex gap-2">
                                <select id="event-cat-input" class="flex-1 bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-300 focus:outline-none focus:border-indigo-500 transition-colors">
                                    <option value="work">업무/공부</option>
                                    <option value="personal">개인 일정</option>
                                    <option value="health">운동/루틴</option>
                                </select>
                                <input type="time" id="event-time-input" class="w-32 bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500 transition-colors">
                            </div>
                            <button onclick="addEvent()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition text-sm">일정 추가하기</button>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3">오늘의 일정</h4>
                        <div id="event-list" class="space-y-2">
                            <!-- Dynamic Event Items -->
                        </div>
                    </div>

                    <!-- 오늘의 루틴 체크리스트 -->
                    <div class="pt-4 border-t border-[#27272a]">
                        <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-3">오늘의 루틴 체크리스트 🔄</h4>
                        <div id="routine-checklist" class="space-y-2">
                            <!-- Dynamic Routine Checklist Items -->
                        </div>
                    </div>
                </div>

                <!-- 탭 2: 하루 정리 -->
                <div id="tab-reflection" class="space-y-4 hidden">
                    <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">하루 피드백 및 다짐</h4>
                    <textarea id="reflection-textarea" oninput="saveReflection()" placeholder="오늘 하루를 돌아보며 피드백이나 내일의 다짐을 적어보세요..." class="w-full h-64 bg-[#1d1d21] border border-[#27272a] rounded-xl p-4 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 resize-none transition-colors"></textarea>
                </div>

                <!-- 탭 3: 자유 일기장 -->
                <div id="tab-diary" class="space-y-4 hidden">
                    <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">자유 일기장</h4>
                    <textarea id="diary-textarea" oninput="saveDiary()" placeholder="자유롭게 생각을 기록하세요..." class="w-full h-64 bg-[#1d1d21] border border-[#27272a] rounded-xl p-4 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 resize-none transition-colors"></textarea>
                </div>
            </div>

            <!-- Drawer Bottom Tab Switcher -->
            <div id="drawer-tab-bar" class="h-14 border-t border-[#27272a] grid grid-cols-3 bg-[#151518] p-2 gap-1 shrink-0 text-xs font-medium transition-colors sticky bottom-0 z-20">
                <button onclick="switchDrawerTab('schedule')" id="drawer-tab-schedule" class="bg-[#27272a] text-white rounded-lg transition flex items-center justify-center">일정</button>
                <button onclick="switchDrawerTab('reflection')" id="drawer-tab-reflection" class="text-zinc-400 hover:text-white rounded-lg transition flex items-center justify-center">정리</button>
                <button onclick="switchDrawerTab('diary')" id="drawer-tab-diary" class="text-zinc-400 hover:text-white rounded-lg transition flex items-center justify-center">일기</button>
            </div>
        </aside>
    </div>

    <!-- Routine Management Modal -->
    <div id="routine-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="modal-box" class="bg-[#18181b] border border-[#27272a] rounded-2xl w-full max-w-md p-6 space-y-6 shadow-2xl transition-colors">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-zinc-100">⚡ 반복 루틴 관리</h3>
                <button onclick="closeModal('routine')" class="text-zinc-400 hover:text-white text-lg">✕</button>
            </div>
            <div id="modal-input-box" class="space-y-3 bg-[#1d1d21] p-4 rounded-xl border border-[#27272a] transition-colors">
                <div class="flex gap-2">
                    <input type="text" id="routine-title-input" placeholder="새로운 루틴 이름 입력" class="flex-1 bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors">
                    <input type="time" id="routine-time-input" class="w-32 bg-[#121216] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div class="flex items-center justify-between gap-2 pt-1">
                    <div class="flex gap-1 text-xs overflow-x-auto pb-1" id="routine-days-selector">
                        <button type="button" onclick="toggleRoutineDay(this, 0)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition shrink-0" data-day="0">일</button>
                        <button type="button" onclick="toggleRoutineDay(this, 1)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition shrink-0" data-day="1">월</button>
                        <button type="button" onclick="toggleRoutineDay(this, 2)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition shrink-0" data-day="2">화</button>
                        <button type="button" onclick="toggleRoutineDay(this, 3)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition shrink-0" data-day="3">수</button>
                        <button type="button" onclick="toggleRoutineDay(this, 4)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition shrink-0" data-day="4">목</button>
                        <button type="button" onclick="toggleRoutineDay(this, 5)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition shrink-0" data-day="5">금</button>
                        <button type="button" onclick="toggleRoutineDay(this, 6)" class="routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition shrink-0" data-day="6">토</button>
                    </div>
                    <button onclick="addRoutine()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-lg font-medium transition">루틴 추가</button>
                </div>
            </div>
            <div class="space-y-2 max-h-60 overflow-y-auto" id="routine-list-modal">
                <!-- Dynamic Routine List -->
            </div>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        let currentDate = new Date();
        let selectedDateStr = formatDateKey(new Date());
        let viewMode = 'month';
        let currentTheme = localStorage.getItem('chrono_theme') || 'dark';
        let activeCategories = { work: true, personal: true, health: true };

        let dbEvents = JSON.parse(localStorage.getItem('chrono_events') || '{}');
        let dbRoutines = JSON.parse(localStorage.getItem('chrono_routines') || '[]');
        let dbRoutineLogs = JSON.parse(localStorage.getItem('chrono_routine_logs') || '{}');
        let dbReflections = JSON.parse(localStorage.getItem('chrono_reflections') || '{}');
        let dbDiaries = JSON.parse(localStorage.getItem('chrono_diaries') || '{}');

        function formatDateKey(date) {
            let y = date.getFullYear();
            let m = String(date.getMonth() + 1).padStart(2, '0');
            let d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function updateCurrentTimeDisplay() {
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth() + 1;
            const d = now.getDate();
            const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
            const w = weekDays[now.getDay()];
            const timeEl = document.getElementById('current-time-display');
            if (timeEl) {
                timeEl.textContent = `${y}. ${m}. ${d}. (${w})`;
            }
        }

        function initApp() {
            applyTheme(currentTheme);
            updateCurrentTimeDisplay();
            renderCalendar();
            selectDate(selectedDateStr);
            startNotificationMonitor();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('chrono_theme', currentTheme);
            applyTheme(currentTheme);
        }

        function applyTheme(theme) {
            const body = document.getElementById('app-body');
            const header = document.getElementById('app-header');
            const headerBadge = document.getElementById('header-badge');
            const sidebar = document.getElementById('app-sidebar');
            const mainContent = document.getElementById('main-content');
            const calNavHeader = document.getElementById('cal-nav-header');
            const calNavBtns = document.getElementById('cal-nav-btns');
            const calTitle = document.getElementById('cal-title');
            const btnTodayNav = document.getElementById('btn-today-nav');
            const drawer = document.getElementById('app-drawer');
            const drawerHeader = document.getElementById('drawer-header');
            const drawerDateTitle = document.getElementById('drawer-date-title');
            const drawerTabBar = document.getElementById('drawer-tab-bar');
            const modalBox = document.getElementById('modal-box');
            const eventInputBox = document.getElementById('event-input-box');
            const modalInputBox = document.getElementById('modal-input-box');
            
            const btnNotif = document.getElementById('btn-notif');
            const btnBackup = document.getElementById('btn-backup');
            const btnRestore = document.getElementById('btn-restore');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            const themeToggleBtn = document.getElementById('theme-toggle-btn');

            body.setAttribute('data-theme', theme);

            if (theme === 'light') {
                body.className = "min-h-screen flex flex-col bg-white text-zinc-900";
                if(header) header.className = "h-14 bg-white border-b border-zinc-200 flex items-center justify-between px-4 md:px-6 shrink-0 transition-colors sticky top-0 z-30";
                if(headerBadge) headerBadge.className = "text-xs text-zinc-600 bg-zinc-100 px-2 py-0.5 rounded hidden sm:inline-block";
                if(sidebar) sidebar.className = "w-full md:w-64 bg-zinc-50 md:border-r border-b md:border-b-0 border-zinc-200 flex flex-col shrink-0 transition-colors";
                if(mainContent) mainContent.className = "flex-1 flex flex-col bg-white transition-colors min-h-[500px]";
                if(calNavHeader) calNavHeader.className = "h-16 border-b border-zinc-200 flex items-center justify-between px-4 md:px-8 shrink-0 bg-white transition-colors";
                if(calNavBtns) calNavBtns.className = "flex items-center bg-zinc-100 rounded-lg border border-zinc-200 p-0.5 transition-colors";
                if(calTitle) calTitle.className = "text-lg md:text-xl font-bold text-zinc-900";
                if(btnTodayNav) btnTodayNav.className = "px-2.5 md:px-3 py-1 text-xs font-medium text-zinc-700 hover:text-zinc-950 transition";
                if(drawer) drawer.className = "w-full md:w-96 bg-zinc-50 md:border-l border-t md:border-t-0 border-zinc-200 flex flex-col shrink-0 transition-colors";
                if(drawerHeader) drawerHeader.className = "h-16 border-b border-zinc-200 flex items-center justify-between px-6 shrink-0 transition-colors";
                if(drawerDateTitle) drawerDateTitle.className = "text-base font-bold text-zinc-900";
                if(drawerTabBar) drawerTabBar.className = "h-14 border-t border-zinc-200 grid grid-cols-3 bg-zinc-100 p-2 gap-1 shrink-0 text-xs font-medium transition-colors sticky bottom-0 z-20";
                if(modalBox) modalBox.className = "bg-white border border-zinc-200 rounded-2xl w-full max-w-md p-6 space-y-6 shadow-2xl transition-colors";
                if(eventInputBox) eventInputBox.className = "space-y-3 bg-white p-4 rounded-xl border border-zinc-200 transition-colors";
                if(modalInputBox) modalInputBox.className = "space-y-3 bg-white p-4 rounded-xl border border-zinc-200 transition-colors";
                
                const inputs = document.querySelectorAll('#event-title-input, #event-cat-input, #event-time-input, #routine-title-input, #routine-time-input, #reflection-textarea, #diary-textarea');
                inputs.forEach(el => {
                    el.className = el.className.replace(/bg-\[#121216\]/g, 'bg-zinc-50').replace(/bg-\[#1d1d21\]/g, 'bg-white').replace(/border-\[#27272a\]/g, 'border-zinc-200').replace(/text-zinc-100/g, 'text-zinc-900').replace(/text-zinc-200/g, 'text-zinc-900').replace(/text-zinc-300/g, 'text-zinc-800').replace(/placeholder-zinc-500/g, 'placeholder-zinc-400 shadow-sm');
                });

                if(btnNotif) btnNotif.className = "w-full bg-zinc-200 hover:bg-zinc-300 text-zinc-800 text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5";
                if(btnBackup) btnBackup.className = "bg-zinc-200 hover:bg-zinc-300 text-zinc-800 text-xs py-2 px-3 rounded-lg transition text-center font-medium";
                if(btnRestore) btnRestore.className = "bg-zinc-200 hover:bg-zinc-300 text-zinc-800 text-xs py-2 px-3 rounded-lg transition text-center font-medium";
                if(themeToggleBtn) themeToggleBtn.className = "bg-zinc-200 hover:bg-zinc-300 text-zinc-800 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5";

                if(themeIcon) themeIcon.textContent = "🌙";
                if(themeText) themeText.textContent = "다크 모드";
            } else {

                if(sidebar) sidebar.className = "w-full md:w-64 bg-[#18181b] md:border-r border-b md:border-b-0 border-[#27272a] flex flex-col shrink-0 transition-colors";
                if(mainContent) mainContent.className = "flex-1 flex flex-col bg-[#121216] transition-colors min-h-[500px]";
                if(calNavHeader) calNavHeader.className = "h-16 border-b border-[#27272a] flex items-center justify-between px-4 md:px-8 shrink-0 bg-[#151518] transition-colors";
                if(calNavBtns) calNavBtns.className = "flex items-center bg-[#1d1d21] rounded-lg border border-[#27272a] p-0.5 transition-colors";
                if(calTitle) calTitle.className = "text-lg md:text-xl font-bold text-zinc-100";
                if(btnTodayNav) btnTodayNav.className = "px-2.5 md:px-3 py-1 text-xs font-medium text-zinc-300 hover:text-white transition";
                if(drawer) drawer.className = "w-full md:w-96 bg-[#18181b] md:border-l border-t md:border-t-0 border-[#27272a] flex flex-col shrink-0 transition-colors";
                if(drawerHeader) drawerHeader.className = "h-16 border-b border-[#27272a] flex items-center justify-between px-6 shrink-0 transition-colors";
                if(drawerDateTitle) drawerDateTitle.className = "text-base font-bold text-zinc-100";
                if(drawerTabBar) drawerTabBar.className = "h-14 border-t border-[#27272a] grid grid-cols-3 bg-[#151518] p-2 gap-1 shrink-0 text-xs font-medium transition-colors sticky bottom-0 z-20";
                if(modalBox) modalBox.className = "bg-[#18181b] border border-[#27272a] rounded-2xl w-full max-w-md p-6 space-y-6 shadow-2xl transition-colors";
                if(eventInputBox) eventInputBox.className = "space-y-3 bg-[#1d1d21] p-4 rounded-xl border border-[#27272a] transition-colors";
                if(modalInputBox) modalInputBox.className = "space-y-3 bg-[#1d1d21] p-4 rounded-xl border border-[#27272a] transition-colors";

                inputs.forEach(el => {
                    el.className = el.className.replace(/bg-zinc-50/g, 'bg-[#121216]').replace(/bg-white/g, 'bg-[#1d1d21]').replace(/border-zinc-200/g, 'border-[#27272a]').replace(/text-zinc-900/g, 'text-zinc-100').replace(/text-zinc-800/g, 'text-zinc-300').replace(/shadow-sm/g, '');
                });

                if(btnNotif) btnNotif.className = "w-full bg-[#27272a] hover:bg-[#3f3f46] text-zinc-200 text-xs font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5";
                if(btnBackup) btnBackup.className = "bg-[#27272a] hover:bg-[#3f3f46] text-zinc-300 text-xs py-2 px-3 rounded-lg transition text-center font-medium";
                if(btnRestore) btnRestore.className = "bg-[#27272a] hover:bg-[#3f3f46] text-zinc-300 text-xs py-2 px-3 rounded-lg transition text-center font-medium";
                if(themeToggleBtn) themeToggleBtn.className = "bg-[#27272a] hover:bg-[#3f3f46] text-zinc-200 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5";

                if(themeIcon) themeIcon.textContent = "☀️";
                if(themeText) themeText.textContent = "라이트 모드";
            }
            renderCalendar();
            renderEventsForSelectedDate();
            renderRoutineChecklist();
            loadReflectionAndDiary();
        }

        function exportData() {
            const backupData = {
                events: dbEvents,
                routines: dbRoutines,
                routine_logs: dbRoutineLogs,
                reflections: dbReflections,
                diaries: dbDiaries,
                version: "1.0",
                date: new Date().toISOString()
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `chrono_backup_${formatDateKey(new Date())}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.events && imported.routines) {
                        if (confirm("기존 데이터 위에 백업 파일을 덮어씁니다. 계속하시겠습니까?")) {
                            dbEvents = imported.events || {};
                            dbRoutines = imported.routines || [];
                            dbRoutineLogs = imported.routine_logs || {};
                            dbReflections = imported.reflections || {};
                            dbDiaries = imported.diaries || {};

                            localStorage.setItem('chrono_events', JSON.stringify(dbEvents));
                            localStorage.setItem('chrono_routines', JSON.stringify(dbRoutines));
                            localStorage.setItem('chrono_routine_logs', JSON.stringify(dbRoutineLogs));
                            localStorage.setItem('chrono_reflections', JSON.stringify(dbReflections));
                            localStorage.setItem('chrono_diaries', JSON.stringify(dbDiaries));

                            alert("데이터가 성공적으로 복원되었습니다!");
                            renderCalendar();
                            selectDate(selectedDateStr);
                        }
                    } else {
                        alert("유효하지 않은 CHRONO 백업 파일입니다.");
                    }
                } catch (err) {
                    alert("파일을 읽는 중 오류가 발생했습니다.");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                alert('이 브라우저는 알림을 지원하지 않습니다.');
                return;
            }
            Notification.requestPermission().then(permission => {
                const statusEl = document.getElementById('notif-status');
                if (statusEl) {
                    if (permission === 'granted') {
                        statusEl.textContent = '알림 활성화됨 ✓';
                        statusEl.className = 'text-[11px] text-center text-emerald-500 font-medium';
                        new Notification('CHRONO 알림', { body: 'CHRONO 알림 설정이 성공적으로 완료되었습니다!' });
                    } else {
                        statusEl.textContent = '알림 차단됨';
                        statusEl.className = 'text-[11px] text-center text-red-500 font-medium';
                    }
                }
            });
        }

        function startNotificationMonitor() {
            setInterval(() => {
                updateCurrentTimeDisplay();

                const now = new Date();
                const todayStr = formatDateKey(now);
                const currentHour = String(now.getHours()).padStart(2, '0');
                const currentMin = String(now.getMinutes()).padStart(2, '0');
                const currentTimeStr = `${currentHour}:${currentMin}`;

                if (dbEvents[todayStr]) {
                    dbEvents[todayStr].forEach(ev => {
                        if (ev.time === currentTimeStr && !ev.notified) {
                            ev.notified = true;
                            if (Notification.permission === 'granted') {
                                new Notification(`[CHRONO 일정]`, { body: ev.title });
                            }
                        }
                    });
                }

                let dayOfWeek = now.getDay();
                dbRoutines.forEach(r => {
                    if (r.days.includes(dayOfWeek) && r.time === currentTimeStr && !r.notified) {
                        r.notified = true;
                        if (Notification.permission === 'granted') {
                            new Notification(`[CHRONO 루틴]`, { body: r.title });
                        }
                    }
                });
            }, 1000);
        }

        function renderCalendar() {
            if (viewMode === 'month') {
                renderMonthView();
            } else {
                renderWeekView();
            }
        }

        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const titleEl = document.getElementById('cal-title');
            if(titleEl) titleEl.textContent = `${year}년 ${month + 1}월`;

            const daysHeader = document.getElementById('days-header');
            if(daysHeader) daysHeader.style.display = 'grid';

            const grid = document.getElementById('calendar-grid');
            if(!grid) return;
            
            let gridBg = currentTheme === 'light' ? 'bg-zinc-200 border-zinc-200' : 'bg-[#27272a] border-[#27272a]';
            grid.className = `grid grid-cols-7 grid-rows-6 gap-px flex-1 ${gridBg} rounded-xl overflow-hidden border min-h-[350px]`;
            grid.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            let totalCells = 42;
            let daysHtml = '';

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                let d = prevLastDay - i;
                let prevMonth = month === 0 ? 11 : month - 1;
                let prevYear = month === 0 ? year - 1 : year;
                let dateStr = `${prevYear}-${String(prevMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                daysHtml += createCellHtml(d, dateStr, true, false);
            }

            for (let d = 1; d <= lastDay; d++) {
                let dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                let isToday = formatDateKey(new Date()) === dateStr;
                daysHtml += createCellHtml(d, dateStr, false, isToday);
            }

            let remainingCells = totalCells - (firstDayIndex + lastDay);
            for (let d = 1; d <= remainingCells; d++) {
                let nextMonth = month === 11 ? 0 : month + 1;
                let nextYear = month === 11 ? year + 1 : year;
                let dateStr = `${nextYear}-${String(nextMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                daysHtml += createCellHtml(d, dateStr, true, false);
            }

            grid.innerHTML = daysHtml;
        }

        function renderWeekView() {
            const grid = document.getElementById('calendar-grid');
            const daysHeader = document.getElementById('days-header');
            if(daysHeader) daysHeader.style.display = 'none';
            if(!grid) return;

            let gridBg = currentTheme === 'light' ? 'bg-zinc-200 border-zinc-200' : 'bg-[#27272a] border-[#27272a]';
            grid.className = `grid grid-cols-7 grid-rows-1 gap-px ${gridBg} rounded-xl overflow-hidden border min-h-[350px]`;
            grid.innerHTML = '';

            let curr = new Date(currentDate);
            let first = curr.getDate() - curr.getDay();
            let sunday = new Date(curr.setDate(first));

            let startYear = sunday.getFullYear();
            let startMonth = sunday.getMonth() + 1;
            let startDay = sunday.getDate();

            let saturday = new Date(sunday);
            saturday.setDate(saturday.getDate() + 6);
            let endYear = saturday.getFullYear();
            let endMonth = saturday.getMonth() + 1;
            let endDay = saturday.getDate();

            const titleEl = document.getElementById('cal-title');
            if(titleEl) titleEl.textContent = `${startYear}.${startMonth}.${startDay} ~ ${endYear}.${endMonth}.${endDay}`;

            let daysHtml = '';
            for (let i = 0; i < 7; i++) {
                let d = new Date(sunday);
                d.setDate(sunday.getDate() + i);
                let dateStr = formatDateKey(d);
                let isToday = formatDateKey(new Date()) === dateStr;
                
                let dayNames = ['일', '월', '화', '수', '목', '금', '토'];
                let weekdayName = dayNames[i];
                let colorStyle = i === 0 ? 'text-red-500' : (i === 6 ? 'text-blue-500' : 'text-zinc-400');

                let events = dbEvents[dateStr] || [];
                let filteredEvents = events.filter(ev => activeCategories[ev.category]);

                let badgesHtml = '';
                filteredEvents.forEach(ev => {
                    let colorClass = ev.category === 'work' ? 'bg-blue-500/20 text-blue-600 dark:text-blue-400' : ev.category === 'personal' ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400' : 'bg-amber-500/20 text-amber-600 dark:text-amber-400';
                    badgesHtml += `<div class="text-[10px] lg:text-[11px] px-1.5 lg:px-2 py-1 rounded mb-1 truncate ${colorClass}">${ev.time ? ev.time + ' ' : ''}${ev.title}</div>`;
                });

                let selectionClass = selectedDateStr === dateStr ? (currentTheme === 'light' ? 'bg-zinc-100 ring-1 ring-indigo-500' : 'bg-[#202025] ring-1 ring-indigo-500') : (currentTheme === 'light' ? 'bg-white hover:bg-zinc-50' : 'bg-[#151518] hover:bg-[#1a1a1e]');
                let todayIndicator = isToday ? 'bg-indigo-600 text-white font-bold' : '';

                daysHtml += `
                    <div onclick="selectDate('${dateStr}')" class="${selectionClass} p-2 lg:p-3 flex flex-col cursor-pointer transition relative overflow-hidden group h-full">
                        <div class="flex items-center justify-between mb-2 lg:mb-3 pb-1.5 lg:pb-2 border-b ${currentTheme === 'light' ? 'border-zinc-100' : 'border-[#27272a]'}">
                            <span class="text-xs font-semibold ${colorStyle}">${weekdayName}</span>
                            <span class="text-xs font-medium w-5 h-5 lg:w-6 lg:h-6 flex items-center justify-center rounded-full ${todayIndicator} ${isToday ? '' : (currentTheme === 'light' ? 'text-zinc-800' : 'text-zinc-200')}">${d.getDate()}</span>
                        </div>
                        <div class="space-y-1 overflow-y-auto flex-1">
                            ${badgesHtml}
                        </div>
                    </div>
                `;
            }
            grid.innerHTML = daysHtml;
        }

        function createCellHtml(dayNum, dateStr, isOtherMonth, isToday) {
            let events = dbEvents[dateStr] || [];
            let filteredEvents = events.filter(ev => activeCategories[ev.category]);

            let badgesHtml = '';
            filteredEvents.slice(0, 2).forEach(ev => {
                let colorClass = ev.category === 'work' ? 'bg-blue-500/20 text-blue-600 dark:text-blue-400' : ev.category === 'personal' ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400' : 'bg-amber-500/20 text-amber-600 dark:text-amber-400';
                badgesHtml += `<div class="text-[9px] lg:text-[10px] px-1.5 py-0.5 rounded truncate ${colorClass}">${ev.time ? ev.time + ' ' : ''}${ev.title}</div>`;
            });
            if (filteredEvents.length > 2) {
                badgesHtml += `<div class="text-[9px] text-zinc-400 px-1">+${filteredEvents.length - 2} more</div>`;
            }

            let selectionClass = selectedDateStr === dateStr ? (currentTheme === 'light' ? 'bg-zinc-100 ring-1 ring-indigo-500' : 'bg-[#202025] ring-1 ring-indigo-500') : (currentTheme === 'light' ? 'bg-white hover:bg-zinc-50' : 'bg-[#151518] hover:bg-[#1a1a1e]');
            let textClass = isOtherMonth ? 'text-zinc-400 dark:text-zinc-600' : (currentTheme === 'light' ? 'text-zinc-800' : 'text-zinc-200');
            let todayIndicator = isToday ? 'bg-indigo-600 text-white font-bold' : '';

            return `
                <div onclick="selectDate('${dateStr}')" class="${selectionClass} p-1.5 lg:p-2 flex flex-col justify-between cursor-pointer transition relative overflow-hidden group min-h-[55px] md:min-h-[70px]">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium w-5 h-5 lg:w-6 lg:h-6 flex items-center justify-center rounded-full ${todayIndicator} ${textClass}">${dayNum}</span>
                    </div>
                    <div class="space-y-1 mt-1 overflow-hidden">
                        ${badgesHtml}
                    </div>
                </div>
            `;
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            let parts = dateStr.split('-');
            const titleEl = document.getElementById('drawer-date-title');
            if (titleEl) {
                titleEl.textContent = `${parts[0]}년 ${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
            }
            renderCalendar();
            renderEventsForSelectedDate();
            renderRoutineChecklist();
            loadReflectionAndDiary();
        }

        function renderEventsForSelectedDate() {
            let container = document.getElementById('event-list');
            if (!container) return;
            let events = dbEvents[selectedDateStr] || [];
            if (events.length === 0) {
                container.innerHTML = `<div class="text-xs text-zinc-400 text-center py-3 ${currentTheme === 'light' ? 'bg-white border-zinc-200' : 'bg-[#1d1d21] border-[#27272a]'} rounded-xl border">등록된 일정이 없습니다.</div>`;
                return;
            }
            container.innerHTML = events.map((ev, idx) => {
                let dotColor = ev.category === 'work' ? 'bg-blue-500' : ev.category === 'personal' ? 'bg-emerald-500' : 'bg-amber-500';
                let itemBg = currentTheme === 'light' ? 'bg-white border-zinc-200 text-zinc-900 shadow-sm' : 'bg-[#1d1d21] border-[#27272a] text-zinc-200';
                return `
                    <div class="flex items-center justify-between ${itemBg} p-2.5 lg:p-3 rounded-xl border text-sm transition-colors">
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            <span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span>
                            <span class="truncate text-xs lg:text-sm">${ev.time ? '<span class="text-xs text-indigo-500 dark:text-indigo-400 font-mono mr-1">[' + ev.time + ']</span>' : ''}${ev.title}</span>
                        </div>
                        <button onclick="deleteEvent(${idx})" class="text-zinc-400 hover:text-red-500 text-xs px-1.5 py-0.5 transition">✕</button>
                    </div>
                `;
            }).join('');
        }

        function addEvent() {
            let titleInput = document.getElementById('event-title-input');
            let catInput = document.getElementById('event-cat-input');
            let timeInput = document.getElementById('event-time-input');
            if (!titleInput || !titleInput.value.trim()) return;

            if (!dbEvents[selectedDateStr]) dbEvents[selectedDateStr] = [];
            dbEvents[selectedDateStr].push({
                title: titleInput.value.trim(),
                category: catInput ? catInput.value : 'work',
                time: timeInput ? timeInput.value : '',
                notified: false
            });

            localStorage.setItem('chrono_events', JSON.stringify(dbEvents));
            titleInput.value = '';
            if (timeInput) timeInput.value = '';
            renderCalendar();
            renderEventsForSelectedDate();
        }

        function deleteEvent(idx) {
            dbEvents[selectedDateStr].splice(idx, 1);
            if (dbEvents[selectedDateStr].length === 0) delete dbEvents[selectedDateStr];
            localStorage.setItem('chrono_events', JSON.stringify(dbEvents));
            renderCalendar();
            renderEventsForSelectedDate();
        }

        function renderRoutineChecklist() {
            let container = document.getElementById('routine-checklist');
            if (!container) return;
            let dayOfWeek = new Date(selectedDateStr).getDay();
            let todaysRoutines = dbRoutines.filter(r => r.days.includes(dayOfWeek));

            if (todaysRoutines.length === 0) {
                container.innerHTML = `<div class="text-xs text-zinc-400 text-center py-2.5 ${currentTheme === 'light' ? 'bg-white border-zinc-200' : 'bg-[#1d1d21] border-[#27272a]'} rounded-xl border">오늘 예정된 루틴이 없습니다.</div>`;
                return;
            }

            let logs = dbRoutineLogs[selectedDateStr] || [];
            container.innerHTML = todaysRoutines.map(r => {
                let isChecked = logs.includes(r.id);
                let itemBg = currentTheme === 'light' ? 'bg-white border-zinc-200 shadow-sm' : 'bg-[#1d1d21] border-[#27272a]';
                return `
                    <label class="flex items-center justify-between ${itemBg} p-2.5 lg:p-3 rounded-xl border cursor-pointer transition-colors">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleRoutineLog('${r.id}')" class="w-4 h-4 accent-indigo-500 rounded">
                            <span class="text-xs lg:text-sm ${isChecked ? 'line-through text-zinc-400' : (currentTheme === 'light' ? 'text-zinc-900' : 'text-zinc-200')}">${r.title} ${r.time ? '<span class="text-xs text-indigo-500 dark:text-indigo-400 font-mono ml-1">(' + r.time + ')</span>' : ''}</span>
                        </div>
                        <span class="text-[10px] text-zinc-500 ${currentTheme === 'light' ? 'bg-zinc-100' : 'bg-[#27272a]'} px-2 py-0.5 rounded">루틴</span>
                    </label>
                `;
            }).join('');
        }

        function toggleRoutineLog(routineId) {
            if (!dbRoutineLogs[selectedDateStr]) dbRoutineLogs[selectedDateStr] = [];
            let logs = dbRoutineLogs[selectedDateStr];
            let idx = logs.indexOf(routineId);
            if (idx > -1) {
                logs.splice(idx, 1);
            } else {
                logs.push(routineId);
            }
            localStorage.setItem('chrono_routine_logs', JSON.stringify(dbRoutineLogs));
            renderRoutineChecklist();
            renderCalendar();
        }

        function renderRoutineModalList() {
            let container = document.getElementById('routine-list-modal');
            if (!container) return;
            if (dbRoutines.length === 0) {
                container.innerHTML = `<div class="text-xs text-zinc-400 text-center py-3">등록된 루틴이 없습니다.</div>`;
                return;
            }
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            container.innerHTML = dbRoutines.map(r => {
                let daysStr = r.days.map(d => dayNames[d]).join(', ');
                let itemBg = currentTheme === 'light' ? 'bg-zinc-50 border-zinc-200 text-zinc-900' : 'bg-[#121216] border-[#27272a] text-zinc-200';
                return `
                    <div class="flex items-center justify-between ${itemBg} p-2.5 lg:p-3 rounded-xl border text-sm transition-colors">
                        <div>
                            <div class="font-medium text-xs lg:text-sm">${r.title} ${r.time ? '<span class="text-xs text-indigo-500 dark:text-indigo-400 font-mono ml-1">[' + r.time + ']</span>' : ''}</div>
                            <div class="text-[10px] lg:text-[11px] text-zinc-400">반복: ${daysStr}</div>
                        </div>
                        <button onclick="deleteRoutine('${r.id}')" class="text-zinc-400 hover:text-red-500 text-xs px-2 py-1">삭제</button>
                    </div>
                `;
            }).join('');
        }

        let newRoutineSelectedDays = [1, 2, 3, 4, 5];
        function toggleRoutineDay(btn, dayNum) {
            let idx = newRoutineSelectedDays.indexOf(dayNum);
            if (idx > -1) {
                newRoutineSelectedDays.splice(idx, 1);
                btn.className = `routine-day-btn w-7 h-7 rounded-full ${currentTheme === 'light' ? 'bg-zinc-200 text-zinc-700' : 'bg-[#27272a] text-zinc-400'} font-medium flex items-center justify-center transition shrink-0`;
            } else {
                newRoutineSelectedDays.push(dayNum);
                btn.className = "routine-day-btn w-7 h-7 rounded-full bg-indigo-600 text-white font-medium flex items-center justify-center transition shrink-0";
            }
        }

        function addRoutine() {
            let input = document.getElementById('routine-title-input');
            let timeInput = document.getElementById('routine-time-input');
            if (!input || !input.value.trim() || newRoutineSelectedDays.length === 0) return;
            dbRoutines.push({
                id: 'r_' + Date.now(),
                title: input.value.trim(),
                time: timeInput ? timeInput.value : '',
                days: [...newRoutineSelectedDays],
                notified: false
            });
            localStorage.setItem('chrono_routines', JSON.stringify(dbRoutines));
            input.value = '';
            if (timeInput) timeInput.value = '';
            renderRoutineModalList();
            renderCalendar();
            renderRoutineChecklist();
        }

        function deleteRoutine(id) {
            dbRoutines = dbRoutines.filter(r => r.id !== id);
            localStorage.setItem('chrono_routines', JSON.stringify(dbRoutines));
            renderRoutineModalList();
            renderCalendar();
            renderRoutineChecklist();
        }

        function loadReflectionAndDiary() {
            let refEl = document.getElementById('reflection-textarea');
            let diaryEl = document.getElementById('diary-textarea');
            if (refEl) {
                refEl.value = dbReflections[selectedDateStr] || '';
                refEl.className = `w-full h-64 ${currentTheme === 'light' ? 'bg-white border-zinc-200 text-zinc-900 placeholder-zinc-400 shadow-sm' : 'bg-[#1d1d21] border-[#27272a] text-zinc-100 placeholder-zinc-500'} border rounded-xl p-4 text-sm focus:outline-none focus:border-indigo-500 resize-none transition-colors`;
            }
            if (diaryEl) {
                diaryEl.value = dbDiaries[selectedDateStr] || '';
                diaryEl.className = `w-full h-64 ${currentTheme === 'light' ? 'bg-white border-zinc-200 text-zinc-900 placeholder-zinc-400 shadow-sm' : 'bg-[#1d1d21] border-[#27272a] text-zinc-100 placeholder-zinc-500'} border rounded-xl p-4 text-sm focus:outline-none focus:border-indigo-500 resize-none transition-colors`;
            }
        }

        function saveReflection() {
            let refEl = document.getElementById('reflection-textarea');
            if (!refEl) return;
            let val = refEl.value;
            if (val) dbReflections[selectedDateStr] = val;
            else delete dbReflections[selectedDateStr];
            localStorage.setItem('chrono_reflections', JSON.stringify(dbReflections));
        }

        function saveDiary() {
            let diaryEl = document.getElementById('diary-textarea');
            if (!diaryEl) return;
            let val = diaryEl.value;
            if (val) dbDiaries[selectedDateStr] = val;
            else delete dbDiaries[selectedDateStr];
            localStorage.setItem('chrono_diaries', JSON.stringify(dbDiaries));
        }

        function openModal(name) {
            if (name === 'routine') {
                renderRoutineModalList();
                document.getElementById('routine-modal').classList.remove('hidden');
                document.getElementById('routine-modal').classList.add('flex');
            }
        }

        function closeModal(name) {
            if (name === 'routine') {
                document.getElementById('routine-modal').classList.remove('flex');
                document.getElementById('routine-modal').classList.add('hidden');
            }
        }

        function moveNav(dir) {
            if (viewMode === 'month') {
                currentDate.setMonth(currentDate.getMonth() + dir);
            } else {
                currentDate.setDate(currentDate.getDate() + (dir * 7));
            }
            renderCalendar();
        }

        function goToday() {
            currentDate = new Date();
            selectDate(formatDateKey(currentDate));
        }

        function setViewMode(mode) {
            viewMode = mode;
            let monthBtn = document.getElementById('btn-view-month');
            let weekBtn = document.getElementById('btn-view-week');
            if (monthBtn && weekBtn) {
                monthBtn.className = mode === 'month' ? 'px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition' : 'px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:bg-zinc-200 dark:hover:bg-[#27272a] hover:text-white transition';
                weekBtn.className = mode === 'week' ? 'px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white transition' : 'px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:bg-zinc-200 dark:hover:bg-[#27272a] hover:text-white transition';
            }
            renderCalendar();
        }

        function toggleCategory(cat, checkbox) {
            activeCategories[cat] = checkbox.checked;
            renderCalendar();
        }

        function switchDrawerTab(tab) {
            ['schedule', 'reflection', 'diary'].forEach(t => {
                let tabEl = document.getElementById(`tab-${t}`);
                let drawerTabEl = document.getElementById(`drawer-tab-${t}`);
                let navEl = document.getElementById(`nav-${t}`);
                if (tabEl) tabEl.classList.add('hidden');
                if (drawerTabEl) drawerTabEl.className = currentTheme === 'light' ? "text-zinc-500 hover:text-zinc-900 rounded-lg transition flex items-center justify-center" : "text-zinc-400 hover:text-white rounded-lg transition flex items-center justify-center";
                if (navEl) navEl.className = `w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:${currentTheme === 'light' ? 'bg-zinc-100 text-zinc-900' : 'bg-[#202024] text-white'} transition`;
            });
            let targetTab = document.getElementById(`tab-${tab}`);
            let targetDrawerTab = document.getElementById(`drawer-tab-${tab}`);
            let targetNav = document.getElementById(`nav-${tab}`);
            if (targetTab) targetTab.classList.remove('hidden');
            if (targetDrawerTab) targetDrawerTab.className = currentTheme === 'light' ? "bg-white text-zinc-900 shadow-sm rounded-lg transition flex items-center justify-center font-semibold" : "bg-[#27272a] text-white rounded-lg transition flex items-center justify-center";
            if (targetNav) targetNav.className = `w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium ${currentTheme === 'light' ? 'bg-zinc-200 text-zinc-900' : 'bg-[#27272a] text-white'} transition`;
        }

        window.onload = initApp;
    </script>
</body>
</html>
